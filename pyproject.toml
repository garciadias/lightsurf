[tool.poetry]
name = "lightsurf"
version = "0.1.0"
description = ""
authors = ["Rafael Dias <rafaelagd@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
astropy = "^6.1.4"
pandas = "^2.2.3"
tqdm = "^4.66.5"
matplotlib = "^3.9.2"
click = "^8.1.7"
pandera = "^0.20.4"
xgboost = "^2.1.1"
pydantic = "^2.9.2"
scikit-learn = "^1.5.2"
seaborn = "^0.13.2"
mlflow = "^2.17.0"
tensorflow = "^2.17.0"
pyyaml = "^6.0.2"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
taskipy = "^1.13.0"
isort = "^5.13.2"
black = "^24.10.0"
mypy = "^1.11.2"
ruff = "^0.6.9"
ipykernel = "^6.29.5"
frictionless = "^5.18.0"
pyqt5 = "^5.15.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
omit = ["*/lightsurf/exploratory_analysis/*"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = ["--cov=lightsurf", "--cov-report=term-missing"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
exclude = [
    "*/migrations/*",
    "*/settings.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/mlflwo/*",
    "*/__pycache__/*",
]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PT']


[tool.mypy]
ignore_missing_imports = true
exclude = ["lightsurf/domain/services/data/combine_fits.py"]


[tool.taskipy.tasks]
test = "pytest"
lint = "mypy ."
format = "black .; isort .; ruff check . --fix"
pre_test = "task format && task lint"
post_test = "coverage html"
train = "python lightsurf/train.py"
mlflow = "mlflow server --host 0.0.0.0 --port 5000"
download_allstar = "python lightsurf/domain/services/data/download_all_star_list.py --file_url https://data.sdss.org/sas/dr17/apogee/spectro/aspcap/dr17/synspec_rev1/allStar-dr17-synspec_rev1.fits --destination data/allStar-dr17-synspec_rev1.fits"
filter_m_dwarfs = "python lightsurf/domain/services/data/filter_m_dwarfs.py"
download_spectra = "python lightsurf/domain/services/data/download_spectra.py"
download = "task download_allstar && task filter_m_dwarfs && task download_spectra"
combine_spectra = "python lightsurf/domain/services/data/combine_fits.py"
